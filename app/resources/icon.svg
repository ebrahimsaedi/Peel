<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <!-- پس‌زمینه آبی (دقیقا مثل Chop) -->
    <rect width="256" height="256" rx="52" fill="#3b82f6"/>

    <!-- لایه زیرین که بعد از پوست کندن دیده میشه (رنگ آبی تیره مثل خط Chop) -->
    <path d="M 200 160 L 200 216 L 140 216 Z" fill="#1e40af"/>

    <!-- بدنه سند سفید (گوشه پایین سمت راست بریده شده) -->
    <path d="M 56 60 Q 56 48 68 48 L 188 48 Q 200 48 200 60 L 200 160 L 140 216 L 68 216 Q 56 216 56 204 Z" fill="#ffffff"/>

    <!-- لبه‌ی پوست کنده شده (رنگ آبی روشن مثل خطوط متن Chop) -->
    <path d="M 200 160 C 170 160 140 185 140 216 L 200 160 Z" fill="#93c5fd"/>

    <!-- خطوط متن روی سند (دقیقا مثل Chop) -->
    <rect x="76" y="76" width="104" height="10" rx="4" fill="#93c5fd"/>
    <rect x="76" y="102" width="80" height="10" rx="4" fill="#93c5fd"/>
    <rect x="76" y="128" width="92" height="10" rx="4" fill="#93c5fd"/>
    <rect x="76" y="154" width="60" height="10" rx="4" fill="#93c5fd"/>
</svg>
